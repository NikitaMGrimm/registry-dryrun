name: zoom-linux-build
# Builds Zoom on ubuntu-22.04, the host the game's shared std member is built on (horizon-rust/horizon#18261).
# The inputs live in zoom-build.env on this branch; a push runs it.
on:
  push:
    branches: [zoom-linux-build]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ctl
          persist-credentials: false
      - name: Read inputs
        run: cat ctl/zoom-build.env >> "$GITHUB_ENV" && cat ctl/zoom-build.env
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: horizon-rust/horizon-mods
          ref: ${{ env.MODS_REF }}
          path: mods
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.99.1
          components: rust-src
          targets: wasm32-unknown-unknown
      - name: Install cargo-horizon-mod at the Nightly's commit
        run: cargo install --locked --git https://github.com/horizon-rust/horizon --rev "$HORIZON_REV" cargo-horizon-mod
      - name: Move the pin and the version
        working-directory: mods/native/zoom
        run: |
          if [ "$(grep -m1 -oP '(?<=^sdk = ")[0-9a-f]+' Cargo.toml)" != "$HORIZON_REV" ]; then
            cargo horizon-mod update --horizon "$HORIZON_REV"
          fi
          sed -i -E "0,/^version = \"[^\"]+\"/s//version = \"$VERSION\"/" horizon-mod.toml Cargo.toml
          grep -n '^version\|^sdk' horizon-mod.toml Cargo.toml
      - name: Build Zoom
        working-directory: mods/native/zoom
        run: |
          cargo horizon-mod build --wasm
          ls -la target/horizon-mod
          sha256sum target/horizon-mod/*.hmod
      - name: Collect the package and the changed source files
        run: |
          mkdir -p out/src
          cp mods/native/zoom/target/horizon-mod/zoom.hmod "out/zoom-$VERSION.hmod"
          cp mods/native/zoom/horizon-mod.toml mods/native/zoom/Cargo.toml mods/native/zoom/Cargo.lock out/src/
          (cd mods && git status --short && git diff --stat) > out/changes.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zoom-linux
          path: out
          if-no-files-found: error
          retention-days: 7
