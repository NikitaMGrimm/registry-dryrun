# Dry-run of horizon-mods' registry checks with a newer Horizon tool. Read-only: publishes nothing.
name: dryrun
on:
  push:
  workflow_dispatch:
    inputs:
      rev:
        description: Horizon commit
        required: true
permissions:
  contents: read
jobs:
  dryrun:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: horizon-rust/horizon-mods
      HORIZON_REV: ${{ inputs.rev || '11d9932461abda358dd4726f753a3ea5a9a07e31' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/horizon-rev
          key: cargo-horizon-mod-${{ env.HORIZON_REV }}
      - name: Install the tool (timed)
        run: |
          start=$(date +%s)
          bash scripts/install-tool.sh
          echo "install took $(( $(date +%s) - start )) s"
      - name: List
        continue-on-error: true
        run: cargo horizon-mod registry list . > list.txt; echo "exit $?"; wc -l list.txt
      - name: Review (load only)
        continue-on-error: true
        run: cargo horizon-mod registry review . . --author NikitaMGrimm 2>&1 | tail -20
      - name: Fetch files
        continue-on-error: true
        run: bash scripts/fetch.sh .
      - name: Build
        continue-on-error: true
        run: |
          set +e
          mkdir -p site
          cargo horizon-mod registry build . --files files --out site/index.json --site https://horizon-rust.github.io/horizon-mods/ --generated "$(date -u +%FT%TZ)" > build.log 2>&1; echo "exit $?"
          grep -c "" build.log; cut -c1-300 build.log
      - name: Check PRs 1139 1140
        continue-on-error: true
        run: |
          set +e
          for n in 1139 1140; do
            git fetch -q https://github.com/horizon-rust/horizon-mods "pull/$n/head:pr$n"
            git worktree add -q "head$n" "pr$n"
            bash scripts/fetch.sh "head$n" || echo "fetch $n failed"
            echo "== $n"; cargo horizon-mod registry check . "head$n" --files files > "check$n.log" 2>&1; echo "exit $?"; tail -40 "check$n.log"
          done
