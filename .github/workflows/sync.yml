# The versions of projects listed by their GitHub repository (`repo = "owner/name"` in
# mods/<id>.toml): every hour, each new release's file is downloaded and checked with
# `cargo horizon-mod registry release`, and the repository's horizon-registry.toml with
# `registry page` (scripts/sync_releases.py). What passes is kept as versions/<id>.json on the
# `versions` branch, which publish.yml reads. A release that fails is left out and reported in
# the run's summary; it never stops the other projects.
#
# Two jobs: `read` handles the downloads with a read-only token, and `write`, which runs nothing
# downloaded, checks the shape of what `read` hands over, commits it and starts publish.
name: sync
on:
  # TEST ONLY (registry-dryrun)
  push:
    branches: [sync-test]
  schedule:
    - cron: "53 * * * *"
  workflow_dispatch:
permissions: {}
concurrency:
  group: sync
  cancel-in-progress: false
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.apply.outputs.changed }}
    env:
      GH_TOKEN: ${{ github.token }}
      HORIZON_REV: 11d9932461abda358dd4726f753a3ea5a9a07e31  # TEST ONLY
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: The versions branch
        run: |
          mkdir branch
          url="https://github.com/$GITHUB_REPOSITORY"
          # 2: no such branch yet.
          found=0; git ls-remote --exit-code --heads "$url" versions >/dev/null || found=$?
          [ "$found" = 2 ] && exit 0
          [ "$found" = 0 ]
          git fetch -q --depth=1 "$url" versions
          git archive FETCH_HEAD | tar -x -C branch
      # The hourly run installs the tool only when there is something to read.
      - name: What is new
        id: plan
        run: |
          python3 -I scripts/sync_releases.py plan . branch > plan.json
          jq -r '.report[]' plan.json
          jq -r '.projects[] | "\(.id): \(.releases | length) new release(s)\(if .page_due then ", page at \(.newest)" else "" end)"' plan.json
          echo "work=$(jq '.projects | length > 0' plan.json)" >> "$GITHUB_OUTPUT"
      - if: steps.plan.outputs.work == 'true'
        run: scripts/install-tool.sh
      - name: Read them
        id: apply
        if: steps.plan.outputs.work == 'true'
        run: python3 -I scripts/sync_releases.py apply . branch plan.json out
      - if: steps.apply.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: versions
          path: out/
          if-no-files-found: error
          retention-days: 3
  write:
    needs: read
    if: needs.read.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: main
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: versions
          path: out
      - name: Only versions of repository-linked projects, files in their own repositories
        run: |
          mkdir -p out/versions
          python3 -I main/scripts/sync_releases.py validate main out/versions
          if find out -type f | grep -Ev '^out/(versions|state)/[a-z0-9_]{1,64}\.json$'; then
            echo "::error::files other than versions/<id>.json and state/<id>.json"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          path: branch
          fetch-depth: 1
      - name: Commit to the versions branch
        id: commit
        working-directory: branch
        run: |
          found=0; git ls-remote --exit-code --heads origin versions >/dev/null || found=$?
          if [ "$found" = 0 ]; then
            git fetch -q --depth=1 origin versions
            git checkout -q -B versions FETCH_HEAD
          else
            [ "$found" = 2 ]
            git checkout -q --orphan versions
            git rm -rq --cached .
            git clean -fdxq
          fi
          cp -R ../out/. .
          git add -A
          git diff --cached --quiet && exit 0
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "sync: $(git diff --cached --name-only | sed -E 's#.*/##; s#\.json$##' | sort -u | paste -sd ' ')"
          git push -q origin versions
          echo "pushed=true" >> "$GITHUB_OUTPUT"
      - name: Publish
        if: steps.commit.outputs.pushed == 'true'
        run: |
          gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" \
            || echo "::warning::publish not started; its hourly run picks the versions up"
